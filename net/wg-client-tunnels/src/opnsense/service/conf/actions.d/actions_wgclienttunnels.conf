[start]
command:/usr/local/opnsense/scripts/OPNsense/WGClientTunnels/wgct.sh start
parameters:
type:script
message:starting WireGuard client tunnel IPv6 routes

[stop]
command:/usr/local/opnsense/scripts/OPNsense/WGClientTunnels/wgct.sh stop
parameters:
type:script
message:stopping WireGuard client tunnel IPv6 routes

[restart]
command:/usr/local/opnsense/scripts/OPNsense/WGClientTunnels/wgct.sh restart
parameters:
type:script
message:restarting WireGuard client tunnel IPv6 routes

[configure_routes]
command:/usr/local/opnsense/scripts/OPNsense/WGClientTunnels/wgct.sh configure_routes
parameters:
type:script
message:reconfiguring WireGuard client tunnel IPv6 routes

[reconcile]
command:/usr/local/opnsense/scripts/OPNsense/WGClientTunnels/wgct.sh reconcile
parameters:
type:script
message:reconciling WireGuard client tunnel IPv6 routes

[status]
command:/usr/local/opnsense/scripts/OPNsense/WGClientTunnels/wgct.sh status
parameters:
type:script_output
message:requesting WireGuard client tunnel status

[replay_alarm]
# The stock routes.alarm action, but blocking on the lock instead of -n: the
# health mirror calls this after its own reconfigure, when the alarm it caused
# was dropped because it held the lock. -o keeps the lock fd out of everything
# the reconfigure starts.
command:/usr/local/bin/flock -o -w 120 /tmp/filter_reload_gateway.lock /usr/local/etc/rc.routing_configure alarm
parameters:%s
type:script
message:replaying gateway alarm for %s

[health_mirror]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/health_mirror.php
parameters:
type:script
message:mirroring IPv4 health to IPv6 gateways

[list]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json list
parameters:
type:script_output
message:listing WireGuard client tunnels

[tunnel_status]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json status
parameters:
type:script_output
message:listing WireGuard client tunnel findings

[apply]
# The API's step after an in-process Create, and the Apply button of an
# apply-pending tunnel: keyless, the instance uuid only.
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json apply
parameters:%s
type:script_output
message:applying WireGuard client tunnel %s

[remove]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json remove
parameters:%s
type:script_output
message:removing WireGuard client tunnel %s

[remove_dry]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json --dry remove
parameters:%s
type:script_output
message:previewing the removal of WireGuard client tunnel %s

[rebind]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json rebind
parameters:%s %s %s
type:script_output
message:rebinding WireGuard client tunnel %s to %s

[adopt]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json adopt
parameters:%s
type:script_output
message:adopting WireGuard instance %s

[adopt_dry]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json --dry adopt
parameters:%s
type:script_output
message:previewing the adoption of WireGuard instance %s

[ensure_sentinel]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json ensure-sentinel
parameters:
type:script_output
message:ensuring the no-default sentinel gateways

[ensure_sentinel_dry]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json --dry ensure-sentinel
parameters:
type:script_output
message:previewing the no-default sentinel gateways

[measure_mtu]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/WGClientTunnels/tunnel.php --json measure-mtu
parameters:%s %s
type:script_output
message:measuring the tunnel MTU from %s to %s
