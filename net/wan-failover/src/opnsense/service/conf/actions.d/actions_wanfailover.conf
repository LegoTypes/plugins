[start]
command:/usr/local/opnsense/scripts/OPNsense/WanFailover/evaluate.php start
parameters:
type:script
message:starting wan-failover
allowed_groups:wheel,wwwonly

[reload]
command:/usr/local/opnsense/scripts/OPNsense/WanFailover/evaluate.php
parameters:
type:script
message:reloading wan-failover
allowed_groups:wheel,wwwonly

[restart]
command:/usr/local/opnsense/scripts/OPNsense/WanFailover/evaluate.php start
parameters:
type:script
message:restarting wan-failover
allowed_groups:wheel,wwwonly

[stop]
command:/usr/local/opnsense/scripts/OPNsense/WanFailover/evaluate.php stop
parameters:
type:script
message:stopping wan-failover (releasing its holds)
allowed_groups:wheel,wwwonly

[status]
command:/usr/local/opnsense/scripts/OPNsense/WanFailover/evaluate.php status
parameters:
type:script_output
errors:no
message:requesting wan-failover status
allowed_groups:wheel,wwwonly

[holds]
command:/usr/local/opnsense/scripts/OPNsense/WanFailover/evaluate.php holds
parameters:
type:script_output
message:requesting wan-failover holds
allowed_groups:wheel,wwwonly

[evaluate]
# No description: core offers an action that has one as a scheduled job (System: Settings: Cron) and runs such a
# job as nobody, whom allowed_groups refuses. The plugin's own minute job is in root's crontab.
command:/usr/local/opnsense/scripts/OPNsense/WanFailover/evaluate.php
parameters:
type:script
message:wan-failover evaluation
allowed_groups:wheel,wwwonly

[release]
command:/usr/local/opnsense/scripts/OPNsense/WanFailover/evaluate.php release
parameters:
type:script
message:releasing every wan-failover hold
allowed_groups:wheel,wwwonly

[failback_now]
command:/usr/local/opnsense/scripts/OPNsense/WanFailover/evaluate.php failback-now
parameters:
type:script
message:ending the wan-failover failback delay
allowed_groups:wheel,wwwonly

[kill_states]
# errors:no, so a kill that exits 1 (a rejected target, a failed listing) answers its own line, not "Execute error"
command:/usr/local/opnsense/scripts/OPNsense/WanFailover/evaluate.php kill-states
parameters:%s
type:script_output
errors:no
message:wan-failover killing the states routed via %s
allowed_groups:wheel,wwwonly

[watcher_reload]
# Core's own signal to its gateway watcher (dpinger.inc, after a monitor configure): the watcher re-reads the
# configuration, so it knows a force_down wan-failover just saved. The pid file and the command line must both
# match, so a stale pid file never signals another process; no match exits non-zero and wan-failover falls back
# to "interface routes configure".
command:/bin/pkill -HUP -F /var/run/gateway_watcher.pid -f gateway_watcher.php
parameters:
type:script
message:wan-failover reloading the gateway watcher
allowed_groups:wheel,wwwonly

[replay_alarm]
# The stock routes.alarm, but blocking (-w 120) instead of -n: wan-failover calls it after its own
# save, whose alarms were dropped while it held the lock. -o keeps the lock fd out of everything
# the routing reconfigure starts.
command:/usr/local/bin/flock -o -w 120 /tmp/filter_reload_gateway.lock /usr/local/etc/rc.routing_configure alarm
parameters:%s
type:script
message:wan-failover replaying gateway alarm (%s)
allowed_groups:wheel,wwwonly
