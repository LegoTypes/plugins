[status]
command:/usr/local/opnsense/scripts/OPNsense/MacAliasCache/macalias.py status
parameters:
type:script_output
message:MAC alias cache status
allowed_groups:wheel,wwwonly

[flush]
command:/usr/local/opnsense/scripts/OPNsense/MacAliasCache/macalias.py flush
parameters:
type:script_output
message:MAC alias cache flush
allowed_groups:wheel,wwwonly

[neighbors]
# No description: core offers an action that has one as a scheduled job (System: Settings: Cron) and runs such a
# job as nobody, whom allowed_groups refuses. The tick's own minute job is the package's file in /usr/local/etc/cron.d.
command:/usr/local/opnsense/scripts/OPNsense/MacAliasCache/macalias.py neighbors
parameters:
type:script_output
message:MAC alias cache neighbor addresses
allowed_groups:wheel,wwwonly
