# a comment before everything

server:
  do-not-query-localhost: no   # trailing comment

forward-zone:
  # name is quoted below
  name: "."

  forward-tls-upstream: yes   # tls
  forward-addr: "192.0.2.53@853#dns.example"
  # forward-first: yes (commented out)
  forward-addr: 2001:db8::53@853#dns.example

forward-zone:
  name: example.net
  forward-addr: 192.0.2.2
