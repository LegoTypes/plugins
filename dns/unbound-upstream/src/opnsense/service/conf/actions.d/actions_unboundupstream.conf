[start]
command:/usr/local/opnsense/scripts/OPNsense/UnboundUpstream/evaluate.php start
parameters:
type:script
message:starting unbound-upstream

[restart]
command:/usr/local/opnsense/scripts/OPNsense/UnboundUpstream/evaluate.php start
parameters:
type:script
message:restarting unbound-upstream

[reload]
command:/usr/local/opnsense/scripts/OPNsense/UnboundUpstream/evaluate.php evaluate
parameters:
type:script
message:reloading unbound-upstream

[stop]
command:/usr/local/opnsense/scripts/OPNsense/UnboundUpstream/evaluate.php stop
parameters:
type:script
message:stopping unbound-upstream

[status]
command:/usr/local/opnsense/scripts/OPNsense/UnboundUpstream/service_status.php
parameters:
type:script_output
errors:no
message:requesting unbound-upstream status

[state]
command:/usr/local/opnsense/scripts/OPNsense/UnboundUpstream/evaluate.php status
parameters:
type:script_output
message:requesting unbound-upstream state

[evaluate]
command:/usr/local/opnsense/scripts/OPNsense/UnboundUpstream/evaluate.php evaluate
parameters:%s
type:script
description:Unbound upstream evaluation
message:unbound-upstream evaluation (%s)
